<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="560" viewBox="0 0 1280 560" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">Loki evidence and replay lifecycle</title>
  <desc id="desc">A run compiles a scenario with a seed into canonical normalized JSON, executes faults while recording every resolved decision, and writes seven artifacts under runs slash run-id. Replay loads the recorded ledger, re-applies each decision at its recorded stream position when the workload repeats, and exits nonzero if any decision never found its position.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5bb5"/>
    </marker>
    <style>
      .canvas { fill: #f7f8fc; }
      .title { fill: #20242e; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group { fill: #f0eee9; stroke: #c9cde0; stroke-width: 1.5; rx: 16; }
      .group-title { fill: #69727a; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
      .node rect { fill: #ffffff; stroke: #2e3942; stroke-width: 2; rx: 12; }
      .node .label { fill: #20242e; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .detail { fill: #69727a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .number { fill: #4f5bb5; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
      .flow { stroke: #4f5bb5; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-label { fill: #4f5bb5; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .mono { fill: #20242e; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1280" height="560"/>
  <text class="title" x="64" y="72">Evidence and replay</text>
  <text class="subtitle" x="64" y="98">Every decision records its resolved numbers; replay re-applies them without drawing randomness.</text>

  <rect class="group" x="64" y="140" width="340" height="320"/>
  <text class="group-title" x="96" y="172">Record</text>
  <g class="node">
    <rect x="96" y="196" width="276" height="72"/>
    <text class="number" x="234" y="222">01</text>
    <text class="label" x="234" y="244">Scenario + seed</text>
    <text class="detail" x="234" y="262">strict compile, SHA-256 of canonical JSON</text>
  </g>
  <g class="node">
    <rect x="96" y="304" width="276" height="96"/>
    <text class="number" x="234" y="330">02</text>
    <text class="label" x="234" y="352">Live fault engine</text>
    <text class="detail" x="234" y="370">draws RNG in documented order,</text>
    <text class="detail" x="234" y="386">logs resolved outcomes per decision</text>
  </g>
  <path class="flow" d="M 234 268 L 234 300"/>

  <rect class="group" x="456" y="140" width="360" height="320"/>
  <text class="group-title" x="488" y="172">Artifacts · runs/&lt;run-id&gt;/</text>
  <g class="node">
    <rect x="488" y="192" width="296" height="242"/>
    <text class="number" x="636" y="220">03</text>
    <text class="mono" x="520" y="248">manifest.json</text>
    <text class="mono" x="520" y="274">scenario.yaml</text>
    <text class="mono" x="520" y="300">scenario.normalized.json</text>
    <text class="mono" x="520" y="326">events.jsonl</text>
    <text class="mono" x="520" y="352">connections.jsonl</text>
    <text class="mono" x="520" y="378">metrics.json · summary.json</text>
    <text class="detail" x="636" y="408">events.jsonl is the decision ledger:</text>
    <text class="detail" x="636" y="426">rule, position, applied parameters</text>
  </g>

  <rect class="group" x="868" y="140" width="348" height="320"/>
  <text class="group-title" x="900" y="172">Replay</text>
  <g class="node">
    <rect x="900" y="196" width="284" height="72"/>
    <text class="number" x="1042" y="222">04</text>
    <text class="label" x="1042" y="244">Load ledger</text>
    <text class="detail" x="1042" y="262">verify scenario hash against manifest</text>
  </g>
  <g class="node">
    <rect x="900" y="304" width="284" height="96"/>
    <text class="number" x="1042" y="330">05</text>
    <text class="label" x="1042" y="354">Re-apply at positions</text>
    <text class="detail" x="1042" y="374">workload must reproduce recorded</text>
    <text class="detail" x="1042" y="390">(conn, direction, stream offset)</text>
  </g>
  <path class="flow" d="M 372 340 L 440 340 L 440 314 L 484 314"/>
  <path class="flow" d="M 788 226 L 852 226 L 896 226"/>
  <path class="flow" d="M 234 400 L 234 500 L 1042 500 L 1042 404"/>
  <text class="flow-label" x="638" y="488">re-enact the same workload against the replayed proxy</text>

  <text class="subtitle" x="64" y="536">Exit codes: 0 all decisions re-applied · 5 a recorded decision never found its position.</text>
</svg>
